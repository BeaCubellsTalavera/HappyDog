services:
  firebase-emulators:
    build:
      context: .
      dockerfile: docker/emulators.Dockerfile
    ports:
      - "4000:4000"
      - "9099:9099"
      - "8080:8080"
      - "5001:5001"
    volumes:
      - ./firebase.json:/app/firebase.json:ro
      - ./firestore.rules:/app/firestore.rules:ro
      - ./functions:/app/functions
    environment:
      # El mount Windows→Linux es lento para muchos archivos pequeños:
      # cargar node_modules de firebase-functions tarda ~20s. Sin este flag
      # el emulador aborta a los 10s con "Cannot determine backend specification".
      FUNCTIONS_DISCOVERY_TIMEOUT: "60"
    command: >
      firebase emulators:start
      --project=demo-happydog
      --only=auth,firestore,functions
